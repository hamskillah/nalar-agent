name: Feature request
description: Propose a runtime, tool, extension or interface improvement.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can a user not do today, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful version. Include safety implications.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Runtime / harness
        - Coding tools
        - Review / fix / verification
        - Sessions / storage
        - MCP / skills / plugins
        - CLI
        - TUI
        - Browser workspace
        - SDK
        - Documentation / packaging
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What did you try, and what trade-offs matter?
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This does not add auto-apply, auto-commit, or silent shell execution.
          required: true
