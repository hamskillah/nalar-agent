name: Bug report
description: Something broke or behaved unexpectedly.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste provider keys, secrets, or private repository contents.
        Redact transcripts and command output before posting.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact command and the smallest reproduction you can share.
      placeholder: |
        nalar code --repo ... --model ... "task"
        observed: ...
        expected: ...
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version and environment
      description: Output of `nalar --version`, OS, Python version, and whether the TUI, CLI, browser or SDK was used.
      placeholder: |
        nalar 0.7.280
        Ubuntu 24.04, Python 3.12.3
        surface: CLI
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Relevant stderr/JSON/events. Never include API keys or credential values.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed keys, secrets and private code from this report.
          required: true
        - label: I searched existing issues for the same failure.
          required: true
