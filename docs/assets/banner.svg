<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Nalar — patch-first coding agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111c2e"/>
      <stop offset="1" stop-color="#0b1a18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee2b8"/>
      <stop offset="1" stop-color="#5aa9ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <circle cx="1035" cy="78" r="150" fill="#5aa9ff" opacity="0.07"/>
  <circle cx="1035" cy="78" r="86" fill="#7ee2b8" opacity="0.05"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="72" y="112" fill="#7ee2b8" font-size="18" letter-spacing="6">LOCAL-FIRST CODING AGENT</text>
    <text x="68" y="196" fill="#f2f6f4" font-size="86" font-weight="700" letter-spacing="-2">Nalar</text>
    <text x="72" y="242" fill="#a9bcc9" font-size="22">Patch-first. Reviewable. Yours to apply.</text>
    <g transform="translate(72,270)">
      <text fill="#7ee2b8" font-size="16">$</text>
      <text x="22" fill="#d7e3ea" font-size="16">nalar code --repo . "Fix the failing test"</text>
    </g>
    <g transform="translate(760,86)">
      <rect width="368" height="150" rx="12" fill="#0a111b" stroke="#26384a"/>
      <circle cx="20" cy="20" r="4" fill="#ff7b72"/><circle cx="36" cy="20" r="4" fill="#f2cc60"/><circle cx="52" cy="20" r="4" fill="#7ee2b8"/>
      <text x="20" y="56" fill="#7ee2b8" font-size="13">status  ok</text>
      <text x="20" y="80" fill="#a9bcc9" font-size="13">turns   5</text>
      <text x="20" y="104" fill="#a9bcc9" font-size="13">calls   4</text>
      <text x="20" y="128" fill="#a9bcc9" font-size="13">patch   staged, not applied</text>
    </g>
  </g>
</svg>
